feature: Product
endpoint: /products
# sync target + RestResourceApi registration name
name: products
fields:
  - name: id
    type: String
    primaryKey: true
  - name: title
    type: String
  - name: price
    type: Double
mutations:
  enabled: true
  create:
    method: POST
    path: /products
  update:
    method: PUT
    path: /products/{id}
  delete:
    method: DELETE
    path: /products/{id}
